<script>
// ===== PRACTICE ENGINE: matching, bombs, cascades, skyfall, roulette, board codes =====
// Orb value = base code (low 4 bits) + 16 thorns + 32 消去不可 (can move, never clears) + 64 超暗闇 (shown black, even while moving) + 128 弱化 (weakened; only a mark here). -1 = empty.
// Base codes: 0 火 1 水 2 木 3 光 4 暗 5 心 6 妨礙 7 毒 8 劇毒 9 炸彈 10 不明 11 石頭
// Cell flags: 2 雲 cloud, 4 輪盤 roulette, 8 封條 tape   (thorns and the other marks travel with the orb, so they are not cell flags)
var Engine = (function () {
  var THORN = 16, NOCLR = 32, SDARK = 64, WEAK = 128, F_CLOUD = 2, F_ROUL = 4, F_TAPE = 8, CAP = 255, BOMB = 9, STONE = 11;
  var THORN_DMG = 4, BOMB_DMG = 20;

  function base(v) { return v < 0 ? -1 : v & 15; }
  function thorny(v) { return v >= 0 && (v & THORN) !== 0; }
  function noclr(v) { return v >= 0 && (v & NOCLR) !== 0; }
  function sdark(v) { return v >= 0 && (v & SDARK) !== 0; }
  function weak(v) { return v >= 0 && (v & WEAK) !== 0; }
  function matchable(v, bombsOk) { if (noclr(v)) return false; var b = base(v); return (b >= 0 && b <= 8) || (bombsOk && b === BOMB); }
  function movable(v) { return v >= 0 && base(v) !== STONE; }

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pick(r, probs) {
    var x = r(), s = 0;
    for (var i = 0; i < probs.length; i++) { s += probs[i]; if (x < s) return i; }
    return probs.length - 1;
  }

  // Skyfall chances for the six colours: +b% lifts a colour from 1/6 by b percentage points,
  // the colours without a boost share what is left equally.
  function skyProbs(boosts) {
    var p = [], fixed = 0, free = 0, i;
    for (i = 0; i < 6; i++) { var b = Math.max(0, Math.min(100, +(boosts && boosts[i]) || 0)); if (b > 0) { p[i] = 1 / 6 + b / 100; fixed += p[i]; } else { p[i] = -1; free++; } }
    if (fixed >= 1 || free === 0) { for (i = 0; i < 6; i++) p[i] = p[i] < 0 ? 0 : p[i] / fixed; return p; }
    var rest = (1 - fixed) / free;
    for (i = 0; i < 6; i++) if (p[i] < 0) p[i] = rest;
    return p;
  }

  // Roulette: cells step through a fixed order. Orbs outside the order (e.g. jammer) become its first entry next.
  var ROUL_ORDER = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  function roulOrder(mask) { var o = ROUL_ORDER.filter(function (c) { return mask & (1 << c); }); return o.length ? o : [0, 1, 2, 3, 4, 5]; }
  function roulNext(v, order) {
    if (v < 0 || base(v) === STONE) return v;
    var i = order.indexOf(base(v)), nb = i < 0 ? order[0] : order[(i + 1) % order.length];
    return nb | (v & (THORN | NOCLR | SDARK | WEAK));
  }

  // Same-colour groups that clear together: runs of >= k in a row or column, joined when touching.
  function findGroups(b, R, C, k, bombsOk) {
    var N = R * C, mark = new Uint8Array(N), any = false, r, c, i, j, v;
    for (r = 0; r < R; r++) for (c = 0; c <= C - k; c++) {
      v = b[r * C + c]; if (!matchable(v, bombsOk)) continue; v = base(v);
      for (j = 1; j < k && matchable(b[r * C + c + j], bombsOk) && base(b[r * C + c + j]) === v; j++);
      if (j === k) { for (j = 0; j < k; j++) mark[r * C + c + j] = 1; any = true; }
    }
    for (c = 0; c < C; c++) for (r = 0; r <= R - k; r++) {
      v = b[r * C + c]; if (!matchable(v, bombsOk)) continue; v = base(v);
      for (j = 1; j < k && matchable(b[(r + j) * C + c], bombsOk) && base(b[(r + j) * C + c]) === v; j++);
      if (j === k) { for (j = 0; j < k; j++) mark[(r + j) * C + c] = 1; any = true; }
    }
    if (!any) return [];
    var groups = [];
    for (i = 0; i < N; i++) {
      if (mark[i] !== 1) continue;
      var col = base(b[i]), cells = [], st = [i]; mark[i] = 2;
      while (st.length) {
        var p = st.pop(), pr = (p / C) | 0, pc = p % C; cells.push(p);
        var nb = [pr > 0 ? p - C : -1, pr < R - 1 ? p + C : -1, pc > 0 ? p - 1 : -1, pc < C - 1 ? p + 1 : -1];
        for (var q = 0; q < 4; q++) { var x = nb[q]; if (x >= 0 && mark[x] === 1 && base(b[x]) === col) { mark[x] = 2; st.push(x); } }
      }
      cells.sort(function (a1, a2) { return a1 - a2; });
      groups.push({ color: col, cells: cells });
    }
    groups.sort(function (g1, g2) {
      var b1 = Math.floor(g1.cells[g1.cells.length - 1] / C), b2 = Math.floor(g2.cells[g2.cells.length - 1] / C);
      return b2 - b1 || (g1.cells[0] % C) - (g2.cells[0] % C);
    });
    return groups;
  }

  // After release: bombs that are not part of a match explode first, wiping their whole row and column
  // (stones survive); then clear, drop, optionally refill, repeat. Bombs only clear in the first pass
  // (a bomb that drops into a line can't be cleared). Stops at 255 combos.
  function resolve(board, R, C, opt) {
    opt = opt || {};
    var k = opt.match || 3, sky = !!opt.skyfall, probs = opt.probs || skyProbs(), r = rng(opt.seed || 1);
    var b = Array.prototype.slice.call(board), frames = [], combos = 0, capped = false, bombDmg = 0, boom = null, i;
    var inGroup = {};
    findGroups(b, R, C, k, true).forEach(function (g) { g.cells.forEach(function (x) { inGroup[x] = 1; }); });
    var bombs = [];
    for (i = 0; i < b.length; i++) if (base(b[i]) === BOMB && !inGroup[i]) bombs.push(i);
    if (bombs.length) {
      var kill = {};
      bombs.forEach(function (x) {
        var rr = (x / C) | 0, cc = x % C, j;
        for (j = 0; j < C; j++) kill[rr * C + j] = 1;
